<html>
    <head>
        <title></title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="maplibre-gl.css">
        <script src="maplibre-gl.js"></script>
        <script src="pmtiles.js"></script>
        <style>
            body {
                margin: 0;
            }
            #map {
                height:100%; width:100%; min-height: 500px;
            }

            .map-overlay {
                font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
                position: absolute;
                width: 25%;
                top: 0;
                left: 0;
                padding: 10px;
            }
    
            .map-overlay .map-overlay-inner {
                background-color: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
                border-radius: 3px;
                padding: 10px;
                margin-bottom: 10px;
            }
    
            .map-overlay h2 {
                line-height: 24px;
                display: block;
                margin: 0 0 10px;
            }
    
    
            .map-overlay input {
                background-color: transparent;
                display: inline-block;
                width: 100%;
                position: relative;
                margin: 0;
                cursor: ew-resize;
            }

        </style>
    </head>
    <body>
        <div id="map"></div>


        <script>
        const API_BASE_URL = "https://worldmap.grasp.deals";
        const PMTILES_URL = `${API_BASE_URL}/protomaps.pmtiles`;
        
        const map = new maplibregl.Map({
          container: "map",
          zoom: 10,
          center: [9.1538064, 45.4565458],
        
          style: {
            version: 8,
        
            sources: {
              example_source: {
                type: "vector",
                url: `pmtiles://${PMTILES_URL}`,
                attribution:
                  '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
              },
        
              osm: {
                type: "raster",
                tiles: [
                  "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],
                tileSize: 256
              }
            },
        
            layers: [
              {
                id: "osm",
                type: "raster",
                source: "osm"
              },
        
              {
                id: "example_layer",
                type: "fill",
                source: "example_source",
                "source-layer": "buildings",
                paint: {
                  "fill-color": "#ff0000"
                }
              }
            ]
          },

          transformRequest: function (url, resourceType) {
            console.debug("MapLibre request:", resourceType, url);
        
            if (
              url.startsWith(`${API_BASE_URL}/api/`) ||
              url.startsWith(`${API_BASE_URL}/protomaps.pmtiles`)
            ) {
              return {
                url,
                credentials: "include"
              };
            }
        
            return { url };
          }
        });
        
        const pmtilesProtocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", pmtilesProtocol.tile);
        
        const pmtilesArchive = new pmtiles.PMTiles(PMTILES_URL);
        pmtilesProtocol.add(pmtilesArchive);
        
        function escapeHtml(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }
        
        function addRestrictedTileLayer() {
          if (map.getSource("restricted-tiles")) {
            return;
          }
        
          map.addSource("restricted-tiles", {
            type: "vector",
        
            tiles: [
              `${API_BASE_URL}/api/restricted-tiles/{z}/{x}/{y}.pbf`
            ],
        
            minzoom: 0,
            maxzoom: 22,
        
            // Use this only if the vector-tile feature ID is available.
            // promoteId: "id"
          });
        
          map.addLayer({
            id: "restricted-features",
            type: "circle",
            source: "restricted-tiles",
            "source-layer": "restricted_tiles",
        
            paint: {
              //"circle-radius": [
                //"interpolate",
                //["linear"],
                //["zoom"],
                //0, 4,
                //8, 7,
                //14, 12
              //],
              "circle-radius": 48,
              "circle-color": "#0000ff",
              "circle-opacity": 1,
              "circle-stroke-color": "#0000ff",
              "circle-stroke-width": 3
            }
          });
        
          map.on("sourcedata", event => {
            if (
              event.sourceId === "restricted-tiles" &&
              event.isSourceLoaded
            ) {
              console.debug("Restricted tile source loaded");
            }
          });
        
          map.on("data", event => {
            if (event.sourceId === "restricted-tiles") {
              console.debug("Restricted tile data event:", {
                dataType: event.dataType,
                isSourceLoaded: event.isSourceLoaded,
                tile: event.tile
              });
            }
          });
        
          map.on("error", event => {
            console.error(
              "Restricted tile error:",
              event.error || event
            );
          });
        
          addRestrictedTileInteraction();
        }
        
        function addRestrictedTileInteraction() {
          if (!map.getLayer("restricted-features")) {
            return;
          }
        
          map.on("mouseenter", "restricted-features", () => {
            map.getCanvas().style.cursor = "pointer";
          });
        
          map.on("mouseleave", "restricted-features", () => {
            map.getCanvas().style.cursor = "";
          });
        
          map.on("click", "restricted-features", event => {
            const feature = event.features?.[0];
        
            if (!feature) {
              return;
            }
        
            const properties = feature.properties || {};
        
            let title = properties.name || "Restricted marker";
            let description = properties.description || "";
        
            if (typeof properties.properties === "string") {
              try {
                const nested = JSON.parse(properties.properties);
        
                if (nested.name) {
                  title = nested.name;
                }
        
                if (nested.description) {
                  description = nested.description;
                }
              } catch (error) {
                console.warn("Could not parse nested feature properties:", error);
              }
            }
        
            new maplibregl.Popup()
              .setLngLat(event.lngLat)
              .setHTML(`
                <strong>${escapeHtml(title)}</strong>
                <p>${escapeHtml(description)}</p>
              `)
              .addTo(map);
          });
        }


        function addRestrictedDomMarkers(markerGeoJson) {
          for (const feature of markerGeoJson.features) {
            if (
              !feature.geometry ||
              feature.geometry.type !== "Point"
            ) {
              continue;
            }
        
            const [longitude, latitude] = feature.geometry.coordinates;
            const properties = feature.properties || {};
        
            const element = document.createElement("div");
        
            element.style.width = "28px";
            element.style.height = "28px";
            element.style.backgroundColor = "#ff0000";
            element.style.border = "4px solid white";
            element.style.borderRadius = "50%";
            element.style.boxSizing = "border-box";
            element.style.cursor = "pointer";
            element.style.boxShadow = "0 0 0 2px rgba(0, 0, 0, 0.35)";
            element.style.zIndex = "9999";
        
            element.addEventListener("click", event => {
              event.stopPropagation();
        
              new maplibregl.Popup()
                .setLngLat([longitude, latitude])
                .setHTML(`
                  <strong>${escapeHtml(properties.name || "Restricted marker")}</strong>
                  <p>${escapeHtml(properties.description || "")}</p>
                `)
                .addTo(map);
            });
        
            new maplibregl.Marker({
              element: element,
              anchor: "center"
            })
              .setLngLat([longitude, latitude])
              .addTo(map);
          }
        }


        function addRestrictedMarkers(markerGeoJson) {
          if (!markerGeoJson || markerGeoJson.type !== "FeatureCollection") {
            throw new Error("Invalid marker GeoJSON response");
          }
        
          if (!Array.isArray(markerGeoJson.features)) {
            throw new Error("GeoJSON features must be an array");
          }
        
          const sourceId = "restricted-markers";
          const layerId = "restricted-markers-layer";
        
          if (map.getLayer(layerId)) {
            map.removeLayer(layerId);
          }
        
          if (map.getSource(sourceId)) {
            map.removeSource(sourceId);
          }
        
          map.addSource(sourceId, {
            type: "geojson",
            data: markerGeoJson
          });
        
          map.addLayer({
            id: layerId,
            type: "circle",
            source: sourceId,
            layout: {
              visibility: "visible"
            },
            paint: {
              "circle-radius": 18,
              "circle-color": "#ff0000",
              "circle-opacity": 1,
              "circle-stroke-color": "#ffffff",
              "circle-stroke-width": 5
            }
          });

          map.on("error", event => {
              console.error("MapLibre error:", event.error || event);
          });
          
          map.on("sourcedata", event => {
              if (event.sourceId === "restricted-markers") {
                  console.log("Marker source event:", {
                      sourceId: event.sourceId,
                      sourceDataType: event.sourceDataType,
                      isSourceLoaded: event.isSourceLoaded
                  });
              }
          });
          
          map.once("idle", () => {
              console.log("Marker source loaded:", map.isSourceLoaded("restricted-markers"));
              console.log("Features from source:",map.querySourceFeatures("restricted-markers"));
              console.log("Features rendered in marker layer:",
                  map.queryRenderedFeatures({
                      layers: ["restricted-markers-layer"]
                  })
              );
          
              console.log("Canvas size:", {
                  width: map.getCanvas().width,
                  height: map.getCanvas().height
              });

              if (map.getLayer("restricted-markers-layer"))
              {
                  map.setPaintProperty("restricted-markers-layer", "circle-radius", 40);
                  map.setPaintProperty("restricted-markers-layer", "circle-color", "#00ff00");
                  map.setPaintProperty("restricted-markers-layer", "circle-opacity", 1);
                  map.setPaintProperty("restricted-markers-layer", "circle-stroke-width", 8);

                  map.moveLayer("restricted-markers-layer");
              }
              map.triggerRepaint();

          });

          // Ensure the marker is above every existing layer.
          map.moveLayer(layerId);
        
          const feature = markerGeoJson.features[0];
        
          if (
            feature &&
            feature.geometry &&
            feature.geometry.type === "Point"
          ) {
            const [longitude, latitude] = feature.geometry.coordinates;
        
            console.log("Moving map to marker:", longitude, latitude);
        
            //map.flyTo({
              //center: [longitude, latitude],
              //zoom: 14,
              //essential: true
            //});
          }
        
          console.log("Marker source:", map.getSource(sourceId));
          console.log("Marker layer:", map.getLayer(layerId));
        
          map.once("idle", () => {
            const renderedFeatures = map.queryRenderedFeatures(undefined, {
              layers: [layerId]
            });
        
            console.log(
              "Rendered restricted markers:",
              renderedFeatures.length,
              renderedFeatures
            );
          });
        
          map.on("mouseenter", layerId, () => {
            map.getCanvas().style.cursor = "pointer";
          });
        
          map.on("mouseleave", layerId, () => {
            map.getCanvas().style.cursor = "";
          });
        
          map.on("click", layerId, event => {
            const clickedFeature = event.features?.[0];
        
            if (!clickedFeature) {
              return;
            }
        
            const properties = clickedFeature.properties || {};
        
            new maplibregl.Popup()
              .setLngLat(event.lngLat)
              .setHTML(`
                <strong>${escapeHtml(properties.name || "Restricted marker")}</strong>
                <p>${escapeHtml(properties.description || "")}</p>
              `)
              .addTo(map);
          });
        }

        
        async function fetchAccessStatus() {
          const response = await fetch(
            `${API_BASE_URL}/api/auth/access`,
            {
              method: "GET",
              credentials: "include",
              headers: {
                Accept: "application/json"
              },
              cache: "no-store"
            }
          );
        
          if (!response.ok) {
            throw new Error(
              `Access request failed: HTTP ${response.status}`
            );
          }
        
          const access = await response.json();
        
          console.debug("Restricted-map access response:", access);
        
          return access;
        }
        

        async function loadRestrictedMarkers()
        {
            const url = `${API_BASE_URL}/api/restricted-markers`;
        
            console.debug("Requesting restricted markers:", url);
        
            const controller = new AbortController();
            const timeoutId = setTimeout(() => {
                controller.abort();
            }, 10000);
        
            try
            {
                const response = await fetch(url, {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        Accept: "application/json"
                    },
                    cache: "no-store",
                    signal: controller.signal
                });
        
                console.debug("Restricted marker response:", response.status, response.headers.get("content-type"));
        
                if (!response.ok)
                {
                    const body = await response.text();
                    throw new Error(`Marker request failed: HTTP ${response.status}; body=${body}`);
                }
        
                const markerGeoJson = await response.json();
                console.debug("Restricted marker GeoJSON:", markerGeoJson);

                addRestrictedMarkers(markerGeoJson);
                addRestrictedDomMarkers(markerGeoJson);

                console.log("Map center:", map.getCenter());
                console.log("Map zoom:", map.getZoom());
                console.log("Map bounds:", map.getBounds());
                console.log("Marker layer exists:", Boolean(map.getLayer("restricted-markers-layer")));
                console.log("Marker source exists:", Boolean(map.getSource("restricted-markers")));
            }
            catch (error)
            {
                if (error.name === "AbortError")
                {
                    console.error("Restricted marker request timed out after 10 seconds:", url);
                }
                else
                {
                    console.error("Restricted marker request failed:", error);
                }
                throw error;
            }
            finally
            {
                clearTimeout(timeoutId);
            }
        }
        

        async function loadRestrictedMapData()
        {
            const access = await fetchAccessStatus();
        
            if (access.authenticated !== true || access.authorized !== true)
            {
                console.warn("Restricted map access denied:", access);
                return;
            }
        
            //addRestrictedTileLayer();
        
            await loadRestrictedMarkers();
        
            map.jumpTo({
                center: [9.1538064, 45.4565458],
                zoom: 14
            });
        
            map.once("idle", () => {
                const tileFeatures = map.queryRenderedFeatures({
                    layers: ["restricted-features"]
                });
        
                const markerFeatures = map.queryRenderedFeatures({
                    layers: ["restricted-markers-layer"]
                });
        
                console.debug("Rendered restricted tile features:", tileFeatures.length, tileFeatures);
                console.debug("Rendered restricted marker features:", markerFeatures.length, markerFeatures);
            });
        }

       
        map.on("load", async () => {
          try {
            await loadRestrictedMapData();
          } catch (error) {
            console.error(
              "Could not load restricted map data:",
              error
            );
          }
        });
        </script>


    </body>
</html>
