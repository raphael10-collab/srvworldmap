<html>
    <head>
        <title></title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="maplibre-gl.css">
        <script src="maplibre-gl.js"></script>
        <script src="pmtiles.js"></script>
        <style>
            body {
                margin: 0;
            }
            #map {
                height:100%; width:100%;
            }

            .map-overlay {
                font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
                position: absolute;
                width: 25%;
                top: 0;
                left: 0;
                padding: 10px;
            }
    
            .map-overlay .map-overlay-inner {
                background-color: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
                border-radius: 3px;
                padding: 10px;
                margin-bottom: 10px;
            }
    
            .map-overlay h2 {
                line-height: 24px;
                display: block;
                margin: 0 0 10px;
            }
    
    
            .map-overlay input {
                background-color: transparent;
                display: inline-block;
                width: 100%;
                position: relative;
                margin: 0;
                cursor: ew-resize;
            }

        </style>
    </head>
    <body>
        <div id="map"></div>



        <script>
        const API_BASE_URL = "https://worldmap.grasp.deals";
        const PMTILES_URL = `${API_BASE_URL}/protomaps.pmtiles`;
        
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);
        
        const pmtilesArchive = new pmtiles.PMTiles(PMTILES_URL);
        protocol.add(pmtilesArchive);
        
        const map = new maplibregl.Map({
            container: "map",
            zoom: 12,
            center: [9.1538064, 45.4565458],

            style: {
                version: 8,
        
                sources: {
                    example_source: {
                        type: "vector",
                        url: `pmtiles://${PMTILES_URL}`,
                        attribution:
                            '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
                    },
        
                    osm: {
                        type: "raster",
                        tiles: [
                            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png"
                        ],
                        tileSize: 256
                    }
                },
        
                layers: [
                    {
                        id: "osm",
                        type: "raster",
                        source: "osm"
                    },
        
                    {
                        id: "example_layer",
                        type: "fill",
                        source: "example_source",
                        "source-layer": "buildings",
                        paint: {
                            "fill-color": "red"
                        }
                    }
                ]
            },
        
            canvasContextAttributes: {
                antialias: true
            },


            transformRequest: function (url, resourceType) {
                console.log("MapLibre request:", resourceType, url);
        
                if (url.includes("/api/restricted-tiles/")) {
                    console.log("RESTRICTED TILE REQUEST:", url);
        
                    return {
                        url: url,
                        credentials: "include"
                    };
                }
        
                return {
                    url: url
                };
            }


        });

        map.on("error", function (event)
        {
            console.error("MAPLIBRE ERROR:", event.error || event);
        });
        
        function escapeHtml(value)
        {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
        
        function addRestrictedTileLayer()
        {
            if (!map.getSource("restricted-tiles"))
            {
                map.addSource("restricted-tiles", {
                    type: "vector",
                    tiles: [
                        `${API_BASE_URL}/api/restricted-tiles/{z}/{x}/{y}.pbf`
                    ],
                    minzoom: 0,
                    maxzoom: 22,
                    //promoteId: "id"
                });
            }

            map.on("dataloading", function (event) {
                if (event.sourceId === "restricted-tiles") {
                    console.log("Restricted tile loading:", event);
                }
            });

            map.on("data", function (event) {
                if (event.sourceId === "restricted-tiles") {
                    console.log("Restricted tile event:", event);
                }
            });
        
            if (!map.getLayer("restricted-features"))
            {
                map.addLayer({
                    id: "restricted-features",
                    type: "circle",
                    source: "restricted-tiles",
                    "source-layer": "restricted",
        
                    paint: {
                        //"circle-radius": [
                            //"interpolate",
                            //["linear"],
                            //["zoom"],
                            //0, 5,
                            //8, 7,
                            //14, 12
                        //],
                        "circle-radius": 25,
                        "circle-color": "#0000ff",
                        "circle-opacity": 1,
                        "circle-stroke-color": "#ffffff",
                        "circle-stroke-width": 4
                    }
                });
            }
        
            addRestrictedMarkerInteraction();
        }
        
        function addRestrictedMarkerInteraction()
        {
            if (!map.getLayer("restricted-features"))
            {
                return;
            }
        
            map.on("mouseenter", "restricted-features", () => {
                map.getCanvas().style.cursor = "pointer";
            });
        
            map.on("mouseleave", "restricted-features", () => {
                map.getCanvas().style.cursor = "";
            });
        
            map.on("click", "restricted-features", (event) => {
                const feature = event.features?.[0];
        
                if (!feature)
                {
                    return;
                }
        
                const properties = feature.properties || {};
        
                let description = properties.description || "";
        
                try
                {
                    const parsedProperties =
                        typeof properties.properties === "string"
                            ? JSON.parse(properties.properties)
                            : properties.properties;
        
                    if (parsedProperties?.description)
                    {
                        description = parsedProperties.description;
                    }
                }
                catch
                {
                    // Retain the original description.
                }
        
                const title = properties.name || "Restricted marker";
        
                new maplibregl.Popup()
                    .setLngLat(event.lngLat)
                    .setHTML(`
                        <strong>${escapeHtml(title)}</strong>
                        <p>${escapeHtml(description)}</p>
                    `)
                    .addTo(map);
            });
        }
        
        function addRestrictedMarkers(markerGeoJson)
        {
            if (!markerGeoJson ||
                markerGeoJson.type !== "FeatureCollection")
            {
                throw new Error("Invalid marker GeoJSON response");
            }
        
            if (map.getSource("restricted-markers"))
            {
                map.getSource("restricted-markers")
                    .setData(markerGeoJson);
        
                return;
            }
        
            map.addSource("restricted-markers", {
                type: "geojson",
                data: markerGeoJson
            });
        
            map.addLayer({
                id: "restricted-markers-layer",
                type: "circle",
                source: "restricted-markers",
        
                paint: {
                    "circle-radius": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        0, 4,
                        8, 6,
                        14, 10
                    ],
                    "circle-color": "#ff0000",
                    "circle-opacity": 0.9,
                    "circle-stroke-color": "#ffffff",
                    "circle-stroke-width": 2
                }
            });
        }
        
        async function loadRestrictedMapData()
        {
            const accessResponse = await fetch(
                `${API_BASE_URL}/api/auth/access`,
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        Accept: "application/json"
                    },
                    cache: "no-store"
                }
            );

            const access = await accessResponse.json();        
        
            if (access.authenticated !== true || access.authorized !== true)
            {
                console.info("Restricted-map access denied:", access);
                return;
            }

            addRestrictedTileLayer();

            map.once("idle", function () {
                const renderedFeatures = map.queryRenderedFeatures({
                    layers: ["restricted-features"]
                });
            
                console.log(
                    "Rendered restricted features:",
                    renderedFeatures.length,
                    renderedFeatures
                );
            });

            map.flyTo({
                center: [9.1538, 45.4565],
                zoom: 12
            });
        
            const markerResponse = await fetch(
                `${API_BASE_URL}/api/restricted-markers`,
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        Accept: "application/geo+json, application/json"
                    },
                    cache: "no-store"
                }
            );
        
            if (!markerResponse.ok)
            {
                throw new Error(
                    `Marker request failed: ${markerResponse.status}`
                );
            }
        
            const markerGeoJson = await markerResponse.json();
            addRestrictedMarkers(markerGeoJson);

            map.once("idle", () => {
              const rendered = map.queryRenderedFeatures({
                layers: ["restricted-features"]
              });
          
              console.debug(
                "Rendered restricted features:",
                rendered.length,
                rendered
              );
            });
        }
        
        map.on("load", async () => {
            try
            {
                await loadRestrictedMapData();
            }
            catch (error)
            {
                console.error("Could not load restricted map data:", error);
            }
        });
        
        map.on("error", (event) => {
            console.error(
                "MapLibre error:",
                event.error || event
            );
        });
        
        map.on("sourcedata", (event) => {
          if (
            event.sourceId === "restricted-tiles" &&
            event.isSourceLoaded
          ) {
            console.debug("Restricted tile source loaded");
          }
        });
        
        map.on("data", function (event) {
            if (event.sourceId === "restricted-tiles") {
                console.log("Restricted source event:", {
                    dataType: event.dataType,
                    sourceId: event.sourceId,
                    isSourceLoaded: event.isSourceLoaded,
                    tile: event.tile
                });
            }
        });

        map.on("error", (event) => {
          console.error("MapLibre error:", event.error || event);
        });

        </script>


    </body>
</html>
