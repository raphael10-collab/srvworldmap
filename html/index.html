<html>
    <head>
        <title></title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="maplibre-gl.css">
        <script src="maplibre-gl.js"></script>
        <script src="pmtiles.js"></script>
        <style>
            body {
                margin: 0;
            }
            #map {
                height:100%; width:100%;
            }

            .map-overlay {
                font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
                position: absolute;
                width: 25%;
                top: 0;
                left: 0;
                padding: 10px;
            }
    
            .map-overlay .map-overlay-inner {
                background-color: #fff;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
                border-radius: 3px;
                padding: 10px;
                margin-bottom: 10px;
            }
    
            .map-overlay h2 {
                line-height: 24px;
                display: block;
                margin: 0 0 10px;
            }
    
    
            .map-overlay input {
                background-color: transparent;
                display: inline-block;
                width: 100%;
                position: relative;
                margin: 0;
                cursor: ew-resize;
            }

        </style>
    </head>
    <body>
        <div id="map"></div>

        <script type="text/javascript">
            let protocol = new pmtiles.Protocol();
            maplibregl.addProtocol("pmtiles", protocol.tile);
            const API_BASE_URL = "https://worldmap.grasp.deals";
            const PMTILES_URL = `${API_BASE_URL}/protomaps.pmtiles`;
            const pmtilesArchive = new pmtiles.PMTiles(PMTILES_URL);
            protocol.add(pmtilesArchive);

            const map = new maplibregl.Map({
                container: "map",
                zoom: 6,
                center: [9.1538064, 45.4565458],
                style: {
                    version: 8,
                    sources: {
                        example_source: {
                            type: "vector",
                            url: `pmtiles://${PMTILES_URL}`,
                            attribution:
                                '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
                        },
                        osm: {
                            type: "raster",
                            tiles: [
                                "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png"
                            ],
                            tileSize: 256
                        }
                    },
                    layers: [
                        {
                            id: "osm",
                            type: "raster",
                            source: "osm"
                        },

                        {
                            id: "example_layer",
                            type: "fill",
                            source: "example_source",
                            "source-layer": "buildings",
                            paint: {
                                "fill-color": "red"
                            }
                        }
                    ]
                },
                canvasContextAttributes: {
                    antialias: true
                }
            });

            map.on("error", (event) => {
                console.error("MapLibre error:", event.error || event);
            });

            function addRestrictedTileLayer() {
                if (!map.getSource("restricted-tiles")) {
                    map.addSource("restricted-tiles", {
                        type: "vector",
                        tiles: [
                            `${window.location.origin}/api/restricted-tiles/{z}/{x}/{y}.pbf`
                        ],
                        minzoom: 0,
                        maxzoom: 22,
                        promoteId: "id"
                    });

                    addRestrictedTileLayer();
                    console.log("Tile source after add:", map.getSource("restricted-tiles"));
                }

                if (!map.getLayer("restricted-features")) {
                    map.addLayer({
                        id: "restricted-features",
                        type: "circle",
                        source: "restricted-tiles",
                        "source-layer": "restricted",
                        paint: {
                            "circle-radius": [
                                "interpolate",
                                ["linear"],
                                ["zoom"],
                                0, 5,
                                8, 7,
                                14, 11
                            ],
                            "circle-color": "#2563eb",
                            "circle-opacity": 0.9,
                            "circle-stroke-color": "#ffffff",
                            "circle-stroke-width": 2
                        }
                    });

                    addRestrictedMarkerInteraction();

                    console.log("Tile layer after add:", map.getLayer("restricted-features"));
                }
            }

            function addRestrictedMarkers(markerGeoJson) {
                if (map.getSource("restricted-markers")) {
                    map.getSource("restricted-markers").setData(markerGeoJson);
                    return;
                }

                map.addSource("restricted-markers", {
                    type: "geojson",
                    data: markerGeoJson
                });

                map.addLayer({
                    id: "restricted-markers-layer",
                    type: "circle",
                    source: "restricted-markers",
                    paint: {
                        "circle-radius": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            0, 4,
                            8, 6,
                            14, 10
                        ],
                        "circle-color": "#e11d48",
                        "circle-stroke-color": "#ffffff",
                        "circle-stroke-width": 2,
                        "circle-opacity": 0.9
                    }
                });
            }
            map.on("load", async () => {
                try {
                    const accessResponse = await fetch("/api/auth/access", {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            Accept: "application/json"
                        },
                        cache: "no-store"
                    });

                    console.log("Access HTTP status:", accessResponse.status);

                    console.log(
                        "Tile source:",
                        map.getSource("restricted-tiles")
                    );

                    console.log(
                        "Tile layer:",
                        map.getLayer("restricted-features")
                    );

                    if (accessResponse.status === 401) {
                        console.info("User is not authenticated");
                        return;
                    }

                    if (accessResponse.status === 403) {
                        console.info("User is not authorized");
                        return;
                    }

                    if (!accessResponse.ok) {
                        throw new Error(
                            `Access request failed: ${accessResponse.status}`
                        );
                    }

                    const access = await accessResponse.json();

                    if (access.authenticated !== true || access.authorized !== true) {
                        console.info("Restricted-map access denied");
                        return;
                    }

                    map.on("sourcedata", (event) => {
                        if (event.sourceId === "restricted-tiles") {
                            console.debug("Restricted tile event:", {
                                sourceId: event.sourceId,
                                sourceDataType: event.sourceDataType,
                                isSourceLoaded: event.isSourceLoaded,
                                tile: event.coord
                            });
                        }
                    });

                    map.on("idle", () => {
                        const features = map.queryRenderedFeatures({
                            layers: ["restricted-features"]
                        });

                        console.debug(
                            "Rendered restricted features:",
                            features.length,
                            features
                        );
                    });

                    const markerResponse = await fetch(
                        "/api/restricted-markers",
                        {
                            method: "GET",
                            credentials: "include",
                            headers: {
                                Accept: "application/geo+json, application/json"
                            },
                            cache: "no-store"
                        }
                    );

                    if (markerResponse.status === 401) {
                        console.info("Marker request is unauthenticated");
                        return;
                    }

                    if (markerResponse.status === 403) {
                        console.info("Marker request is unauthorized");
                        return;
                    }

                    if (!markerResponse.ok) {
                        throw new Error(`Marker request failed: ${markerResponse.status}`);
                    }

                    const markerGeoJson = await markerResponse.json();

                    if (markerGeoJson.type !== "FeatureCollection") {
                        throw new Error("Invalid marker GeoJSON response");
                    }

                    addRestrictedMarkers(markerGeoJson);
                }
                catch (error) {
                    console.error(
                        "Could not load restricted map data:",
                        error
                    );
                }
            });

            function addRestrictedMarkerInteraction() {
                map.on("mouseenter", "restricted-features", () => {
                    map.getCanvas().style.cursor = "pointer";
                });

                map.on("mouseleave", "restricted-features", () => {
                    map.getCanvas().style.cursor = "";
                });

                map.on("click", "restricted-features", (event) => {
                    const feature = event.features && event.features[0];

                    if (!feature) {
                        return;
                    }

                    const properties = feature.properties || {};

                    let description = properties.description || "";

                    /*
                     * If the description is stored inside the JSONB properties
                     * column, it may arrive as a serialized JSON string.
                     */
                    try {
                        const parsedProperties =
                            typeof properties.properties === "string"
                                ? JSON.parse(properties.properties)
                                : properties.properties;

                        if (parsedProperties && parsedProperties.description) {
                            description = parsedProperties.description;
                        }
                    } catch (_) {
                        // Keep the original description if it is not valid JSON.
                    }

                    const title = properties.name || "Restricted marker";

                    new maplibregl.Popup()
                        .setLngLat(event.lngLat)
                        .setHTML(`
                            <strong>${escapeHtml(title)}</strong>
                            <p>${escapeHtml(description)}</p>
                        `)
                        .addTo(map);
                });
            }

            function escapeHtml(value) {
                return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }
        </script>


    </body>
</html>
